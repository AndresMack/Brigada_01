<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brigada de cocina · Actividades</title>
  <style>
    :root{--bg:#fff;--surface:#f6f7f9;--card:rgba(255,255,255,.92);--ink:#111318;--muted:#6f737b;--line:#e6e8ec;--accent:#1769e0;--pale:#e9eef8;--shadow:0 10px 32px rgba(22,29,37,.08)}
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
    .wrap{width:min(1080px,calc(100% - 32px));margin:34px auto 64px}.top{margin-bottom:24px;padding:8px 2px 22px;border-bottom:1px solid var(--line)}
    h1,h2,h3{letter-spacing:-.025em;line-height:1.15}h1{font-size:clamp(2rem,5vw,3.7rem);font-weight:800;margin:0 0 9px}h2,p{margin:0}.subtitle{color:var(--muted);font-size:.95rem}
    .panel,.person{background:var(--card);border:1px solid rgba(225,228,234,.9);border-radius:24px;box-shadow:var(--shadow);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}.panel{padding:22px;margin-bottom:20px}
    .controls{display:flex;align-items:end;justify-content:space-between;gap:14px;margin-bottom:22px}.controls label{width:min(360px,100%)}label span{display:block;font-size:.76rem;font-weight:700;letter-spacing:.04em;margin:0 0 7px;color:var(--muted)}
    select,button{font:inherit}select{width:100%;padding:13px 42px 13px 14px;border:1px solid var(--line);border-radius:14px;background-color:rgba(247,248,250,.94);color:var(--ink);font-weight:650;cursor:pointer;transition:border-color .2s ease,box-shadow .2s ease,background-color .2s ease}select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px rgba(23,105,224,.12);background:#fff}
    .progress-head{display:flex;justify-content:space-between;gap:12px;margin-bottom:8px;font-size:.83rem;color:var(--muted)}.progress-head strong{color:var(--ink)}.progress-head>span:last-child{white-space:nowrap}.track{height:8px;background:var(--pale);border-radius:99px;overflow:hidden}.fill{height:100%;width:0;background:var(--accent);border-radius:inherit;transition:width .35s cubic-bezier(.2,.8,.2,1)}
    .metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}.metric{background:var(--surface);border:1px solid transparent;border-radius:18px;padding:15px;transition:background-color .2s ease,transform .2s ease}.metric:hover{background:#eef3fb;transform:translateY(-2px)}.metric-name{color:var(--muted);font-size:.78rem}.metric-value{font-size:1.65rem;font-weight:800;line-height:1.15;margin-top:3px;letter-spacing:-.03em}
    .people{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.person{padding:22px;transition:transform .25s ease,box-shadow .25s ease,background-color .25s ease}.person:hover{transform:translateY(-3px);box-shadow:0 16px 42px rgba(22,29,37,.11);background:#fff}.person-head{display:flex;justify-content:space-between;gap:12px;align-items:start;margin-bottom:17px}.person h2{font-size:1.45rem;font-weight:800}.count{background:var(--surface);color:var(--ink);border-radius:99px;padding:5px 10px;font-size:.78rem;font-weight:750;white-space:nowrap}.recipe-block{border-top:1px solid var(--line);padding-top:18px;margin-top:20px}.recipe-block h3{font-size:1.03rem;margin:0;font-weight:750}.role{font-size:.86rem;color:var(--muted);margin-top:5px}.recipe-progress{margin-top:13px}
    .task-list{display:grid;gap:7px;margin-top:15px}.task{display:flex;gap:11px;align-items:flex-start;padding:10px 11px;border:1px solid transparent;border-radius:14px;cursor:pointer;transition:background-color .18s ease,border-color .18s ease,transform .18s ease}.task:hover{background:rgba(23,105,224,.045);border-color:rgba(23,105,224,.1)}.task:active{transform:scale(.99)}.task input{appearance:none;width:20px;height:20px;margin:2px 0 0;border:1.5px solid #aeb4bd;border-radius:7px;background:#fff;flex:0 0 auto;transition:background-color .18s ease,border-color .18s ease,box-shadow .18s ease}.task input:checked{background:var(--accent);border-color:var(--accent);box-shadow:inset 0 0 0 4px #fff}.task.done span{text-decoration:line-through;color:#9a9ea5}
    .footer{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:22px;color:var(--muted);font-size:.82rem}.reset{border:0;background:#111318;border-radius:14px;padding:11px 15px;color:#fff;font-weight:700;cursor:pointer;box-shadow:0 8px 18px rgba(17,19,24,.16);transition:transform .18s ease,opacity .18s ease}.reset:hover{transform:translateY(-2px);opacity:.9}.reset:active{transform:translateY(0)}
    .recipe-images{margin-top:42px;padding-top:24px;border-top:1px solid var(--line)}.recipe-images>h2{font-size:clamp(1.4rem,3vw,2rem);margin-bottom:7px}.recipe-images>.subtitle{margin-bottom:17px}.image-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.image-card{margin:0;background:#fff;border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:var(--shadow);cursor:zoom-in;transition:transform .25s ease,box-shadow .25s ease}.image-card:hover{transform:translateY(-3px);box-shadow:0 16px 42px rgba(22,29,37,.11)}.image-card:focus-visible{outline:3px solid rgba(23,105,224,.35);outline-offset:4px}.image-card img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--surface)}.image-card figcaption{padding:14px 16px;font-weight:750}
    .lightbox{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;padding:24px;background:rgba(12,15,20,.76);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);opacity:0;visibility:hidden;transition:opacity .22s ease,visibility .22s ease}.lightbox.open{opacity:1;visibility:visible}.lightbox-content{position:relative;width:min(960px,100%);max-height:calc(100vh - 48px);transform:scale(.96);transition:transform .22s ease}.lightbox.open .lightbox-content{transform:scale(1)}.lightbox img{display:block;width:100%;max-height:calc(100vh - 48px);object-fit:contain;border-radius:20px;background:#fff;box-shadow:0 28px 80px rgba(0,0,0,.42)}.lightbox-close{position:absolute;top:12px;right:12px;width:44px;height:44px;display:grid;place-items:center;border:0;border-radius:50%;background:rgba(17,19,24,.82);color:#fff;font-size:1.7rem;line-height:1;cursor:pointer;backdrop-filter:blur(10px);transition:transform .18s ease,background-color .18s ease}.lightbox-close:hover{transform:scale(1.06);background:#111318}.lightbox-close:focus-visible{outline:3px solid rgba(255,255,255,.75);outline-offset:3px}body.lightbox-open{overflow:hidden}
    ::selection{background:rgba(23,105,224,.2)}
    @media(max-width:720px){.wrap{width:min(100% - 24px,560px);margin:18px auto 48px}.top{padding-top:4px;margin-bottom:18px}.top h1{font-size:2.15rem}.controls,.footer{align-items:flex-start;flex-direction:column}.controls label{width:100%}.people,.image-grid{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr);gap:9px}.metric{padding:13px}.metric-value{font-size:1.4rem}.panel,.person{border-radius:20px;padding:17px}.people{gap:15px}.person:hover,.image-card:hover{transform:none}.task{padding:11px 9px}.task span{font-size:.94rem}.recipe-block{margin-top:18px;padding-top:17px}.recipe-images{margin-top:34px}.lightbox{padding:12px}.lightbox-content,.lightbox img{max-height:calc(100vh - 24px)}.lightbox img{border-radius:16px}.lightbox-close{top:8px;right:8px}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.fill,.metric,.person,.task,.reset,.image-card,select,.lightbox,.lightbox-content{transition:none}}
  </style>
</head>
<body>
  <main class="wrap">
    <header class="top">
      <div><h1>Brigada de cocina</h1><p class="subtitle">Actividades de las dos recetas, por persona y con progreso en vivo.</p></div>
    </header>

    <section class="metrics" id="metrics" aria-label="Progreso individual"></section>

    <section class="panel">
      <div class="controls">
        <label><span>PERSONA</span><select id="person"><option value="all">Toda la brigada</option><option value="santiago">Santiago</option><option value="julian">Julián</option><option value="sofia">Sofía</option><option value="angela">Ángela</option></select></label>
      </div>
      <div class="progress-head"><strong>Progreso general de las dos recetas</strong><span id="overallText">0 de 0 tareas · 0 %</span></div>
      <div class="track"><div class="fill" id="overallFill"></div></div>
    </section>

    <section class="people" id="people" aria-live="polite"></section>
    <footer class="footer"><span>Los cambios se guardan automáticamente en este navegador.</span><button class="reset" id="reset" type="button">Reiniciar todas las tareas</button></footer>

    <section class="recipe-images" aria-labelledby="recipeImagesTitle">
      <h2 id="recipeImagesTitle">Imágenes de las recetas</h2>
      <p class="subtitle">Referencia visual del resultado final de cada plato.</p>
      <div class="image-grid">
        <figure class="image-card" tabindex="0" role="button" aria-label="Ampliar imagen de la receta 1">
          <!-- CAMBIA "receta-1.jpg" por el nombre o la ruta de tu primera imagen. -->
          <img src="receta-1.jpg" alt="Presentación final de la paupiette de pescado">
          <figcaption>Receta 1 · Paupiette de pescado</figcaption>
        </figure>
        <figure class="image-card" tabindex="0" role="button" aria-label="Ampliar imagen de la receta 2">
          <!-- CAMBIA "receta-2.jpg" por el nombre o la ruta de tu segunda imagen. -->
          <img src="receta-2.jpg" alt="Presentación final de la bullabesa">
          <figcaption>Receta 2 · Bullabesa</figcaption>
        </figure>
      </div>
    </section>
  </main>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Imagen ampliada" aria-hidden="true">
    <div class="lightbox-content">
      <img id="lightboxImage" src="" alt="">
      <button class="lightbox-close" id="lightboxClose" type="button" aria-label="Cerrar imagen">&times;</button>
    </div>
  </div>

  <script>
    const recipes={
      r1:{name:'Paupiette de pescado',description:'Paupiette con puré de papa y clorofila de espinaca, salsa normanda y vegetales.',service:'Emplatado: puré como base, paupiette encima, salsa normanda sobre el pescado y vegetales ordenados al costado.',people:{
        angela:{name:'Ángela',role:'Paupiette de pescado + farsa',locked:true,tasks:['Alistar y revisar los filetes de pescado.','Retirar espinas y acondicionar las porciones.','Procesar el salmón para elaborar la farsa.','Integrar con Sofía la crema, la clara, la sazón y la ralladura de limón.','Coordinar con Sofía el relleno de los filetes.','Armar con Sofía los rollos y cerrarlos con palillos.','Cocinar con vino blanco y mantequilla.','Verificar el punto y mantener para el servicio.']},
        santiago:{name:'Santiago',role:'Puré con clorofila de espinaca',tasks:['Pelar y cocinar las papas.','Cocer la espinaca a la inglesa.','Procesar y tamizar la espinaca.','Reducir para concentrar la clorofila.','Pasar las papas y elaborar el puré con mantequilla.','Incorporar la clorofila y rectificar sazón.','Mantener caliente al baño María.']},
        julian:{name:'Julián',role:'Salsa normanda',tasks:['Elaborar el roux.','Laminar y sudar los champiñones en mantequilla.','Desglasar con vino blanco y reducir.','Incorporar roux y fumet.','Mezclar las yemas con crema.','Incorporar la mezcla sin hervir agresivamente.','Sazonar, pasar por chino y reservar caliente.']},
        sofia:{name:'Sofía',role:'Vegetales y zanahorias glaseadas',tasks:['Preparar los bastones de zanahoria.','Glasear con mantequilla, azúcar, sal y agua.','Tornear el zucchini en medio barril.','Cocer el zucchini a la inglesa.','Cortar y cocer la cebolla larga a la inglesa.','Preparar y cocer el apio en bastones.','Saltear los vegetales con mantequilla antes del emplatado.','Al terminar los vegetales, integrar con Ángela la crema, la clara, la sazón y la ralladura de limón.','Coordinar con Ángela el relleno de los filetes.','Armar con Ángela los rollos y cerrarlos con palillos.']}
      }},
      r2:{name:'Bullabesa',description:'Sopa de pescado con mero, pargo y corvina, papas nature, tomates cherry, crostones y rouille.',service:'Emplatado: bullabesa como base, pescados al centro, papas y tomates alrededor; crostón con rouille y queso visible al costado.',people:{
        angela:{name:'Ángela',role:'Mero, pargo y corvina',locked:true,tasks:['Verificar y acondicionar las porciones de pescado.','Sazonar con sal y pimienta.','Calentar el aceite de oliva.','Dorar cada pescado por su mejor cara.','Iniciar el pargo por el lado de la piel.','Girar y dorar los demás lados.','Añadir sopa para terminar la cocción.','Tapar y cocinar a fuego bajo de 5 a 10 minutos.','Comprobar el punto y mantener caliente.']},
        santiago:{name:'Santiago',role:'Rouille + apoyo en crostones',tasks:['Cocinar la papa de la rouille desde agua fría.','Pisar la papa cocida.','Incorporar yema, ajo y páprika.','Emulsionar con aceite de oliva y sazonar.','Reservar la rouille.','Después, cortar la baguette para apoyar a Julián.','Rociar con aceite y hornear 5 minutos a 180 °C.','Montar rouille, agregar emmental y gratinar.']},
        julian:{name:'Julián',role:'Sopa bullabesa + coordinación de crostones',tasks:['Preparar tomate, cebolla, hinojo, ajo y anís.','Dorar cabezas, recortes y espinas en aceite.','Incorporar las verduras.','Desglasar y raspar el fondo.','Agregar vino blanco y reducir.','Incorporar fumet, aromáticos y condimentos.','Cocinar 1 hora a fuego bajo.','Procesar la preparación.','Colar, sazonar y reservar caliente.','Coordinar con Santiago los crostones.']},
        sofia:{name:'Sofía',role:'Papas nature + tomates cherry fritos',tasks:['Lavar, pelar y tornear las papas.','Cocinarlas en fumet con sal y pimienta.','Cocer de 10 a 15 minutos hasta su punto.','Mantener calientes y terminar con aceite de oliva.','Lavar los tomates cherry.','Hacer un corte superficial en cruz.','Freír hasta que la piel comience a desprenderse.','Retirar y reservar calientes.','Al terminar sus preparaciones, disponer las bandejas, pinzas y utensilios para la cocción final.','Tener listos el aceite, los condimentos y la sopa caliente.']}
      }}
    };
    const key='brigada-cocina-v1';
    let state; try{state=JSON.parse(localStorage.getItem(key))||{}}catch{state={}}
    for(const [rid,r] of Object.entries(recipes)){state[rid]??={};for(const [pid,p] of Object.entries(r.people)){if(!Array.isArray(state[rid][pid])||state[rid][pid].length!==p.tasks.length)state[rid][pid]=p.tasks.map(()=>false)}}
    const $=id=>document.getElementById(id), pct=(d,t)=>t?Math.round(d/t*100):0, save=()=>localStorage.setItem(key,JSON.stringify(state));
    function progress(rid,pid){const a=state[rid][pid];return[a.filter(Boolean).length,a.length]}
    function renderMetrics(){const order=['santiago','julian','sofia','angela'];$('metrics').innerHTML=order.map(pid=>{let d=0,t=0;for(const rid of Object.keys(recipes)){const x=progress(rid,pid);d+=x[0];t+=x[1]}return `<div class="metric"><div class="metric-name">${recipes.r1.people[pid].name}</div><div class="metric-value">${pct(d,t)} %</div></div>`}).join('')}
    function render(){
      const filter=$('person').value,order=['santiago','julian','sofia','angela'];$('people').innerHTML='';
      for(const pid of order){
        if(filter!=='all'&&filter!==pid)continue;
        let personDone=0,personTotal=0;
        for(const rid of Object.keys(recipes)){const x=progress(rid,pid);personDone+=x[0];personTotal+=x[1]}
        const card=document.createElement('article');card.className='person';
        card.innerHTML=`<div class="person-head"><h2>${recipes.r1.people[pid].name}</h2><span class="count">${personDone}/${personTotal}</span></div><div class="progress-head"><span>Progreso en las dos recetas</span><span>${pct(personDone,personTotal)} %</span></div><div class="track"><div class="fill" style="width:${pct(personDone,personTotal)}%"></div></div>`;
        for(const [rid,r] of Object.entries(recipes)){
          const p=r.people[pid],[done,total]=progress(rid,pid),block=document.createElement('section');block.className='recipe-block';
          block.innerHTML=`<h3>Receta ${rid==='r1'?'1':'2'} · ${r.name}</h3><p class="role">${p.role}</p><div class="recipe-progress"><div class="progress-head"><span>Progreso</span><span>${done}/${total} · ${pct(done,total)} %</span></div><div class="track"><div class="fill" style="width:${pct(done,total)}%"></div></div></div><div class="task-list"></div>`;
          const list=block.querySelector('.task-list');p.tasks.forEach((task,i)=>{const row=document.createElement('label');row.className='task'+(state[rid][pid][i]?' done':'');row.innerHTML=`<input type="checkbox" ${state[rid][pid][i]?'checked':''}><span>${task}</span>`;row.querySelector('input').addEventListener('change',e=>{state[rid][pid][i]=e.target.checked;save();render()});list.appendChild(row)});
          card.appendChild(block);
        }
        $('people').appendChild(card);
      }
      let done=0,total=0;for(const rid of Object.keys(recipes))for(const pid of order){const x=progress(rid,pid);done+=x[0];total+=x[1]}$('overallText').textContent=`${done} de ${total} tareas · ${pct(done,total)} %`;$('overallFill').style.width=pct(done,total)+'%';renderMetrics();
    }
    $('person').addEventListener('change',render);$('reset').addEventListener('click',()=>{if(confirm('¿Reiniciar todas las tareas de las dos recetas?')){for(const rid of Object.keys(state))for(const pid of Object.keys(state[rid]))state[rid][pid]=state[rid][pid].map(()=>false);save();render()}});render();

    const lightbox=$('lightbox'),lightboxImage=$('lightboxImage'),lightboxClose=$('lightboxClose');
    let lastImageCard=null;

    function openLightbox(card){
      const image=card.querySelector('img');
      lastImageCard=card;
      lightboxImage.src=image.src;
      lightboxImage.alt=image.alt;
      lightbox.classList.add('open');
      lightbox.setAttribute('aria-hidden','false');
      document.body.classList.add('lightbox-open');
      lightboxClose.focus();
    }

    function closeLightbox(){
      lightbox.classList.remove('open');
      lightbox.setAttribute('aria-hidden','true');
      document.body.classList.remove('lightbox-open');
      lightboxImage.src='';
      if(lastImageCard)lastImageCard.focus();
    }

    document.querySelectorAll('.image-card').forEach(card=>{
      card.addEventListener('click',()=>openLightbox(card));
      card.addEventListener('keydown',event=>{
        if(event.key==='Enter'||event.key===' '){
          event.preventDefault();
          openLightbox(card);
        }
      });
    });

    lightboxClose.addEventListener('click',closeLightbox);
    lightbox.addEventListener('click',event=>{
      if(event.target===lightbox)closeLightbox();
    });
    document.addEventListener('keydown',event=>{
      if(event.key==='Escape'&&lightbox.classList.contains('open'))closeLightbox();
    });
  </script>
</body>
</html>
