  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;paramitos-checklist-app&#x27;);
      const boxes = [...root.querySelectorAll(&#x27;input[type=&quot;checkbox&quot;][data-id]&#x27;)];
      const storageKey = &#x27;paramitos-receta-500g-v1&#x27;;

      function loadState() {
        try {
          const saved = JSON.parse(localStorage.getItem(storageKey) || &#x27;{}&#x27;);
          boxes.forEach(box =&gt; { box.checked = Boolean(saved[box.dataset.id]); });
        } catch (_) {}
      }

      function saveState() {
        const state = {};
        boxes.forEach(box =&gt; { state[box.dataset.id] = box.checked; });
        try { localStorage.setItem(storageKey, JSON.stringify(state)); } catch (_) {}
      }

      function setProgress(kind, countId, barId) {
        const group = boxes.filter(box =&gt; box.dataset.kind === kind);
        const done = group.filter(box =&gt; box.checked).length;
        const percent = Math.round((done / group.length) * 100);
        root.querySelector(countId).textContent = `${done} de ${group.length}`;
        const bar = root.querySelector(barId);
        bar.style.width = `${percent}%`;
        bar.parentElement.setAttribute(&#x27;aria-valuenow&#x27;, percent);
        return { done, total: group.length };
      }

      function update() {
        boxes.forEach(box =&gt; box.closest(&#x27;.recipe-check&#x27;).classList.toggle(&#x27;is-done&#x27;, box.checked));
        const ingredients = setProgress(&#x27;ingredient&#x27;, &#x27;#ingredient-count&#x27;, &#x27;#ingredient-bar&#x27;);
        const steps = setProgress(&#x27;step&#x27;, &#x27;#step-count&#x27;, &#x27;#step-bar&#x27;);
        const percent = Math.round(((ingredients.done + steps.done) / (ingredients.total + steps.total)) * 100);
        root.querySelector(&#x27;#total-percent&#x27;).textContent = `${percent}%`;
        const totalBar = root.querySelector(&#x27;#total-bar&#x27;);
        totalBar.style.width = `${percent}%`;
        totalBar.parentElement.setAttribute(&#x27;aria-valuenow&#x27;, percent);
        const ingredientBoxes = boxes.filter(box =&gt; box.dataset.kind === &#x27;ingredient&#x27;);
        root.querySelector(&#x27;#toggle-ingredients&#x27;).textContent = ingredientBoxes.every(box =&gt; box.checked) ? &#x27;Desmarcar ingredientes&#x27; : &#x27;Marcar ingredientes&#x27;;
        saveState();
      }

      boxes.forEach(box =&gt; box.addEventListener(&#x27;change&#x27;, update));
      root.querySelector(&#x27;#toggle-ingredients&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
        const group = boxes.filter(box =&gt; box.dataset.kind === &#x27;ingredient&#x27;);
        const next = !group.every(box =&gt; box.checked);
        group.forEach(box =&gt; { box.checked = next; });
        update();
      });
      root.querySelector(&#x27;#reset-all&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
        boxes.forEach(box =&gt; { box.checked = false; });
        update();
      });

      loadState();
      update();
    })();

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;

    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;

    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;

      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);

      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||

      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil

      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {

  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {

    }

      trigger == null ||

      }

    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
